AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SwachhGram - Garbage Reporting System
Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        REPORTS_TABLE:
          Ref: ReportsTable
        USERS_TABLE:
          Ref: UsersTable
        S3_BUCKET:
          Ref: PhotosBucket
        GP_EMAIL: gp@yourdomain.com
        GP_PHONE: +91XXXXXXXXXX
        REGION: ap-south-1
        COGNITO_USER_POOL_ID: YOUR_USER_POOL_ID
  Api:
    Cors:
      AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
      AllowHeaders: '''Content-Type,Authorization'''
      AllowOrigin: '''*'''
Resources:
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: swachhgram-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: reportId
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: reportId
        KeyType: HASH
      - AttributeName: createdAt
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: statusIndex
        KeySchema:
        - AttributeName: status
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: userIndex
        KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: swachhgram-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: swachhgram-photos-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - POST
          AllowedOrigins:
          - '*'
          MaxAge: 3600
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SwachhGramPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            Resource:
            - Fn::GetAtt:
              - ReportsTable
              - Arn
            - Fn::Sub: ${ReportsTable.Arn}/index/*
            - Fn::GetAtt:
              - UsersTable
              - Arn
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:PutObjectAcl
            Resource:
              Fn::Sub: ${PhotosBucket.Arn}/*
          - Effect: Allow
            Action:
            - rekognition:DetectLabels
            Resource: '*'
          - Effect: Allow
            Action:
            - ses:SendEmail
            - sns:Publish
            Resource: '*'
          - Effect: Allow
            Action:
            - cognito-idp:ListUsers
            - cognito-idp:AdminGetUser
            Resource: '*'
  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ReportsFunction
      Handler: handlers/reports.handler
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      Events:
        CreateReport:
          Type: Api
          Properties:
            Path: /reports
            Method: post
        GetReports:
          Type: Api
          Properties:
            Path: /reports
            Method: get
        GetReport:
          Type: Api
          Properties:
            Path: /reports/{reportId}
            Method: get
        UpdateReport:
          Type: Api
          Properties:
            Path: /reports/{reportId}
            Method: put
        GetPresignedUrl:
          Type: Api
          Properties:
            Path: /upload-url
            Method: post
        AnalyzeImage:
          Type: Api
          Properties:
            Path: /analyze
            Method: post
    Metadata:
      SamResourceId: ReportsFunction
  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AdminFunction
      Handler: handlers/admin.handler
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      Events:
        GetAllReports:
          Type: Api
          Properties:
            Path: /admin/reports
            Method: get
        GetStats:
          Type: Api
          Properties:
            Path: /admin/stats
            Method: get
        GetUsers:
          Type: Api
          Properties:
            Path: /admin/users
            Method: get
        UpdateReportStatus:
          Type: Api
          Properties:
            Path: /admin/reports/{reportId}/status
            Method: put
    Metadata:
      SamResourceId: AdminFunction
Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  PhotosBucketName:
    Description: S3 bucket for photos
    Value:
      Ref: PhotosBucket
